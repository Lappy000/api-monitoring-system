[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-monitoring-system"
dynamic = ["version", "dependencies"]
description = "API monitoring with health checks, uptime analytics, and notifications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
# Keep these pins aligned with requirements-dev.txt.
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-json-report==1.5.0",
    "httpx==0.25.2",
    "aioresponses==0.7.6",
    "faker==20.1.0",
    "black==23.12.0",
    "flake8==6.1.0",
    "isort==7.0.0",
    "mypy==1.7.1",
    "types-PyYAML==6.0.12.12",
    "types-python-dateutil==2.8.19.14",
]

[project.scripts]
api-monitoring-system = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
